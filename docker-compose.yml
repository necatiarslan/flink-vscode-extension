services:
  jobmanager:
    image: flink:1.20
    command: jobmanager
    ports:
      - "8081:8081"
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: jobmanager
        state.checkpoints.dir: file:///opt/flink/data/checkpoints
        state.savepoints.dir: file:///opt/flink/data/savepoints
        execution.checkpointing.interval: 10s
    volumes:
      - ./flink-data:/opt/flink/data

  taskmanager:
    image: flink:1.20
    command: taskmanager
    depends_on:
      - jobmanager
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: jobmanager
        taskmanager.numberOfTaskSlots: 4
    volumes:
      - ./flink-data:/opt/flink/data

  sql-gateway:
    image: flink:1.20
    command: sql-gateway.sh start-foreground
    depends_on:
      - jobmanager
    ports:
      - "8083:8083"
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: jobmanager
        rest.address: jobmanager
        sql-gateway.endpoint.rest.address: 0.0.0.0
        sql-gateway.endpoint.rest.port: 8083
    volumes:
      - ./flink-data:/opt/flink/data